<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="description" content="NEON BREACH - a cyberpunk stealth infiltration game. Slip past sentries, extract 3 data shards per sector, and escape the facility.">
<meta name="theme-color" content="#04060d">
<title>NEON BREACH</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='4' y='4' width='8' height='8' fill='%234dc8ff' transform='rotate(45 8 8)'/></svg>">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #04060d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: 100vmin;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #02030a;
    box-shadow: 0 0 60px rgba(30, 120, 200, 0.25), inset 0 0 80px rgba(0, 0, 0, 0.5);
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
