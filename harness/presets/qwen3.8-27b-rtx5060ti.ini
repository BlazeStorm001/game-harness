version = 1

[qwen]
model = path/to/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q3_K_XL.gguf
mmproj = path/to/mmproj-F16.gguf

n-gpu-layers = 999

ctx-size = 50176
parallel = 1

flash-attn = on

cache-type-k = q8_0
cache-type-v = q8_0

spec-type = draft-mtp
spec-draft-n-max = 2

cache-type-k-draft = q4_0
cache-type-v-draft = q4_0

mlock = true
mmap = true

batch-size = 4096
ubatch-size = 512

temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0

jinja = true
chat-template-kwargs = {"enable_thinking":true, "reasoning_budget":1024}

split-mode = none
main-gpu = 0

image-min-tokens = 1024
load-on-startup = true
